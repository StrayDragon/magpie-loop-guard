<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loop-guard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>loop-guard</h1>
  <p class="muted" id="sub">拦截与注入事件 · 只显示被处理过的请求</p>
</header>

<section id="stats" class="cards"></section>

<section>
  <div class="row">
    <h2>事件</h2>
    <div class="row-end">
      <label class="muted"><input type="checkbox" id="auto"> 自动刷新</label>
      <button type="button" id="reload">刷新</button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="events">
      <thead><tr>
        <th>时间</th><th>请求 id</th><th>模型</th><th>agent</th>
        <th>preset</th><th>触发</th><th>第几轮</th><th>处置</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="muted">载入中…</td></tr></tbody>
    </table>
  </div>
</section>

<section>
  <h2>设置</h2>
  <p class="muted">保存后下一轮请求生效，无需重启。</p>
  <div id="form" class="form"></div>
  <div class="row">
    <button type="button" id="save">保存</button>
    <button type="button" id="raw-toggle">编辑 JSON</button>
    <span id="msg" class="muted"></span>
  </div>
  <textarea id="raw" rows="14" spellcheck="false" hidden></textarea>
</section>

<script src="app.js" defer></script>
</body>
</html>
